<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경도 진행도</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1d2433; --sub:#6b7487; --blue:#2f6bff; --green:#21a366; --line:#e3e7f0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--sub); margin: 0 0 20px; }
  .now { background: #fff7d6; border: 1px solid #f1dc8a; border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }
  .play { display:inline-block; background:var(--blue); color:#fff; text-decoration:none; padding:12px 20px; border-radius:12px; font-weight:700; margin-bottom: 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .head h2 { margin:0; font-size:19px; }
  .pct { font-weight:700; color:var(--blue); }
  .bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:10px 0 12px; }
  .bar i { display:block; height:100%; background:var(--green); border-radius:99px; transition: width .4s; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:6px 0; display:flex; gap:10px; align-items:flex-start; }
  li .c { width:22px; flex:none; }
  li.done { color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>🚓 경도 만들기 진행도 🦹</h1>
  <p class="sub">3초마다 자동으로 새로고침돼요</p>
  <a class="play" href="/">▶ 게임 해보기</a>
  <div class="now" id="now"></div>
  <div id="stages"></div>
</main>
<script>
async function load() {
  try {
    const p = await (await fetch('progress.json?' + Date.now())).json();
    document.getElementById('now').textContent = '🔨 지금 하는 일: ' + p.now;
    document.getElementById('stages').innerHTML = p.stages.map(s => {
      const done = s.items.filter(i => i.done).length;
      const pct = Math.round(done / s.items.length * 100);
      return `<div class="card"><div class="head"><h2>${s.name}</h2><span class="pct">${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <ul>${s.items.map(i => `<li class="${i.done ? 'done' : ''}"><span class="c">${i.done ? '✅' : '⬜'}</span>${i.text}</li>`).join('')}</ul></div>`;
    }).join('');
  } catch (e) {}
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
