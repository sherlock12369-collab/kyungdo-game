<!doctype html><html><body style="margin:0"><iframe id="f" src="index.html" style="width:900px;height:500px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.onload = () => setTimeout(() => {
  const w = f.contentWindow, d = f.contentDocument;
  w.__game.settings.mapId = 'school';
  d.getElementById('startBtn').click();
  const tick = () => { const me = w.__game.me; if (me) { me.x = +q.get('x'); me.z = +q.get('z'); me.y = +q.get('y'); me.vy = 0; me.tp = me.tp; } };
  setInterval(tick, 30);
}, 800);
</script></body></html>
